<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix Clone - Movies</title>

    <link rel="stylesheet" href="movies.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <h1 class="logo">NETFLIX</h1>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="movies.html" class="active">Movies</a>
        </div>
    </nav>


    <!-- Movies Section -->
    <main class="movies-container">

        <h2>Movies & TV Shows</h2>

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search movies..."
            >
        </div>


        <!-- Movie Grid -->
        <section class="movie-grid" id="movieGrid">


            <!-- Movie 1 -->
            <div class="movie-card" data-title="The Vampire Diaries">

                <div
                    class="poster-container"
                    onclick="watchMovie('The Vampire Diaries')"
                >
                    <img
                        src="assets/movie1.jpg"
                        alt="The Vampire Diaries"
                    >

                    <div class="play-overlay">
                        ▶
                    </div>
                </div>

                <div class="movie-info">
                    <h3>The Vampire Diaries</h3>
                    <p>⭐ 8.0</p>

                    <button onclick="watchMovie('The Vampire Diaries')">
                        ▶ Watch Trailer
                    </button>
                </div>

            </div>
