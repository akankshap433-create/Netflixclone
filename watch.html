<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Netflix Clone - Watch Trailer</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* Navigation */

        .watch-navbar {

            height: 70px;

            background: #000;

            display: flex;

            align-items: center;

            padding: 0 5%;
        }


        .logo {

            color: #e50914;

            font-size: 28px;

            font-weight: bold;
        }


        .back-btn {

            margin-left: auto;

            color: white;

            text-decoration: none;

            font-size: 16px;
        }


        .back-btn:hover {

            color: #e50914;
        }


        /* Main */

        .watch-container {

            width: 90%;

            max-width: 1200px;

            margin: 40px auto;
        }


        /* Trailer */

        .trailer-container {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #111;

            border-radius: 8px;

            overflow: hidden;

            cursor: pointer;
        }


        .trailer-poster {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* Dark overlay */

        .trailer-overlay {

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.35);

            display: flex;

            align-items: center;

            justify-content: center;

            transition: background 0.3s ease;
        }


        .trailer-container:hover .trailer-overlay {

            background: rgba(0, 0, 0, 0.5);
        }


        /* Play button */

        .play-button {

            width: 80px;

            height: 80px;

            border-radius: 50%;

            background: #e50914;

            color: white;

            border: none;

            font-size: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding-left: 6px;

            cursor: pointer;

            transition: transform 0.2s ease,
                        background 0.2s ease;
        }


        .play-button:hover {

            transform: scale(1.1);

            background: #b20710;
        }


        /* Movie information */

        .movie-title {

            margin-top: 25px;

            font-size: 32px;
        }


        .movie-description {

            margin-top: 12px;

            color: #ccc;

            font-size: 16px;

            line-height: 1.6;
        }


        .trailer-label {

            margin-top: 12px;

            color: #aaa;

            font-size: 14px;
        }


        /* Mobile */

        @media (max-width: 650px) {

            .watch-container {

                width: 95%;
            }


            .movie-title {

                font-size: 25px;
            }


            .watch-navbar {

                padding: 0 20px;
            }


            .play-button {

                width: 60px;

                height: 60px;

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav class="watch-navbar">

        <div class="logo">
            NETFLIX
        </div>


        <a href="movies.html"
           class="back-btn">

            ← Back to Movies

        </a>

    </nav>



    <!-- Watch Section -->

    <main class="watch-container">


        <!-- Trailer Poster -->

        <div
            class="trailer-container"
            id="trailerContainer"
            onclick="openTrailer()">


            <img
                id="trailerPoster"
                class="trailer-poster"
                src=""
                alt="Trailer Poster">


            <div class="trailer-overlay">

                <button
                    class="play-button"
                    aria-label="Play Trailer">

                    ▶

                </button>

            </div>


        </div>



        <!-- Movie Title -->

        <h1
            class="movie-title"
            id="movieTitle">

            Movie

        </h1>



        <!-- Description -->

        <p
            class="movie-description"
            id="movieDescription">

            Enjoy watching the trailer.

        </p>


        <p class="trailer-label">

            ▶ Click the poster to watch the official trailer on YouTube

        </p>


    </main>



    <!-- JavaScript -->

    <script>


        // Get movie name from URL

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const movieName =
            urlParams.get("movie");


        // Movie trailer data

        const movies = {


            "The Vampire Diaries": {

                video: "_j0pa89de9c",

                description:
                    "Follow the story of the Salvatore brothers and Elena Gilbert in the mysterious town of Mystic Falls."

            },


            "The Witcher": {

                video: "SzS8Ao0H6Co",

                description:
                    "Geralt of Rivia, a mutated monster hunter, struggles to find his place in a dangerous world."

            },


            "Stranger Things": {

                video: "ncn84cMWgRA",

                description:
                    "A group of friends uncover supernatural mysteries and secret experiments in Hawkins."

            },


            "Squid Game": {

                video: "oqxAJKy0ii4",

                description:
                    "Hundreds of desperate contestants compete in mysterious games for a life-changing prize."

            },


            "Alchemy of Souls": {

                video: "iMn6s5XpfhI",

                description:
                    "A powerful sorceress and a young man become entangled in magic, destiny and a mysterious exchange of souls."

            }

        };


        // Current video ID

        let currentVideoId = "";


        // Load movie information

        if (
            movieName &&
            movies[movieName]
        ) {

            const movie =
                movies[movieName];


            // Set title

            document.getElementById(
                "movieTitle"
            ).textContent =
                movieName;


            // Set description

            document.getElementById(
                "movieDescription"
            ).textContent =
                movie.description;


            // Save video ID

            currentVideoId =
                movie.video;


            // Load YouTube thumbnail

            document.getElementById(
                "trailerPoster"
            ).src =
                "https://img.youtube.com/vi/"
                + currentVideoId
                + "/maxresdefault.jpg";

        }


        // Open YouTube trailer

        function openTrailer() {

            if (currentVideoId) {

                const youtubeURL =
                    "https://www.youtube.com/watch?v="
                    + currentVideoId;


                window.location.href =
                    youtubeURL;

            }

        }

    </script>


</body>

</html>
